version: '3.8'

services:
  idv-expo:
    build: .
    ports:
      - "8081:8081"  # Expo 개발 서버
      - "19000:19000"  # Expo Metro bundler
      - "19001:19001"  # Expo DevTools
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    stdin_open: true
    tty: true
    networks:
      - expo-network

    entrypoint:
      - bash

networks:
  expo-network:
    driver: bridge